<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>종윤 시계</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #334155, #020617 60%);
      color: white;
      overflow: hidden;
    }
    .card {
      width: min(90vw, 720px);
      padding: 48px 32px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 32px;
      background: rgba(15, 23, 42, .62);
      box-shadow: 0 30px 90px rgba(0,0,0,.45);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    .label {
      margin: 0 0 18px;
      color: #cbd5e1;
      letter-spacing: .18em;
      font-size: 14px;
      text-transform: uppercase;
    }
    #time {
      font-size: clamp(64px, 13vw, 128px);
      font-weight: 800;
      letter-spacing: -.06em;
      line-height: 1;
      text-shadow: 0 0 40px rgba(96, 165, 250, .35);
    }
    #date {
      margin-top: 22px;
      color: #e2e8f0;
      font-size: clamp(18px, 3vw, 28px);
    }
    .footer {
      margin-top: 34px;
      color: #94a3b8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="label">Jongyun Clock</p>
    <div id="time">00:00:00</div>
    <div id="date">날짜 불러오는 중...</div>
    <div class="footer">네가 시키니까 만든 거야. 딱히 좋아서 그런 건 아니고 😶</div>
  </main>

  <script>
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');

    function tick() {
      const now = new Date();
      timeEl.textContent = new Intl.DateTimeFormat('ko-KR', {
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);
      dateEl.textContent = new Intl.DateTimeFormat('ko-KR', {
        dateStyle: 'full'
      }).format(now);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
